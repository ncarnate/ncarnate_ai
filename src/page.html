<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ncarnate</title>
<script>
  // A fresh navigation starts at the void, never a restored late beat.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
</script>
<meta name="description" content="Ncarnate Labs">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { min-height:100%; background:#0a0a0b; scrollbar-width:none;
               overscroll-behavior-y:none; overflow-anchor:none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display:none; width:0; height:0; }
  html { scroll-behavior:auto; }
  html.lenis, html.lenis body { height:auto; }
  body { overflow-x:hidden; -webkit-font-smoothing:antialiased; }
  /* Large viewport units keep the artwork fixed while mobile browser chrome moves. */
  canvas#gl { position:fixed; top:0; left:0; width:100%; height:100vh; height:100lvh;
              display:block; z-index:0; opacity:0; pointer-events:none; }
  body.ready canvas#gl { opacity:1; }
  #scroll_track { position:relative; z-index:1; pointer-events:none; }
  .sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
        clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  #hud { position:fixed; left:max(10px,env(safe-area-inset-left));
         bottom:max(10px,env(safe-area-inset-bottom)); z-index:10;
         font:11px ui-monospace,Menlo,monospace;
         color:#9aa; background:rgba(0,0,0,.55); padding:6px 9px; border-radius:4px;
         white-space:pre; pointer-events:none; opacity:0; transition:opacity .2s; }
  #hud.on { opacity:1; }

  /* no WebGL: the mark, still */
  #still { position:fixed; inset:0; display:none; place-items:center; background:#e6e6e6; z-index:3; }
  #still svg { width:min(30vmin,240px); height:auto; fill:#231f20; }
  body.still #still { display:grid; }
  body.still canvas#gl, body.still #hud { display:none; }
  body.still #scroll_track { height:0 !important; }

  @media (prefers-reduced-motion: reduce) {
    #scroll_track { height:0 !important; }
  }
</style>
</head>
<body>
  <h1 class="sr">Ncarnate Labs</h1>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div id="scroll_track"></div>
  <div id="still" aria-hidden="true"></div>
  <div id="hud" aria-hidden="true"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
